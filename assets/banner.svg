<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Animated Glowing Orbs -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#cyberGrid); }
    
    /* Animation Keyframes */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.25) translate(30px, -20px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }

    @keyframes pulseOrbRight {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.3) translate(-40px, 20px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }

    @keyframes beamSweep {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes floatPillRev {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .orb-left {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 150px;
    }

    .orb-right {
      animation: pulseOrbRight 9s ease-in-out infinite;
      transform-origin: 1000px 260px;
    }

    .dynamic-beam {
      stroke: url(#accentGrad);
      stroke-width: 2.5;
      stroke-dasharray: 80 120;
      animation: beamSweep 6s linear infinite;
      fill: none;
    }

    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillRev 5.5s ease-in-out infinite; }
    .pill-3 { animation: floatPill 6s ease-in-out infinite; }
    .pill-4 { animation: floatPillRev 6.5s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .gradient-word {
      fill: url(#accentGrad);
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #cbd5e1;
      letter-spacing: 0.2px;
    }

    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" class="bg" />
  <rect width="1200" height="420" rx="16" class="grid" />

  <!-- Animated Glowing Ambience (Behind Foreground Content) -->
  <g class="orb-left">
    <circle cx="180" cy="140" r="220" fill="url(#orbCyan)" />
  </g>
  <g class="orb-right">
    <circle cx="1020" cy="280" r="240" fill="url(#orbViolet)" />
  </g>

  <!-- Flowing Dynamic Data Beams -->
  <path d="M 60 360 C 350 360, 420 310, 600 310 C 780 310, 850 370, 1140 370" class="dynamic-beam" />
  <path d="M 120 70 C 380 70, 480 110, 650 110 C 820 110, 950 60, 1100 60" class="dynamic-beam" style="animation-delay: -3s;" />

  <!-- Top Decorative Badge -->
  <g transform="translate(485, 48)">
    <rect width="230" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="15" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED AI DIRECTORY</text>
  </g>

  <!-- FOREGROUND MAIN HEADINGS (Kept Completely Unobstructed) -->
  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" class="title-text">
    Awesome <tspan class="gradient-word">AI Document Assistant</tspan>
  </text>
  <text x="600" y="198" text-anchor="middle" class="title-text" style="font-size: 38px;">
    &amp; Summarization Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="600" y="246" text-anchor="middle" class="subtitle-text">
    Curated SaaS Platforms, Self-Hosted RAG Engines &amp; Document Intelligence Pipelines
  </text>

  <!-- FOREGROUND FEATURE PILLS (Structured in a bottom container) -->
  <!-- Pill 1: Document Q&A -->
  <g class="pill-1" transform="translate(140, 296)">
    <rect width="195" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" />
    <text x="40" y="26" class="pill-label">📄 PDF Q&amp;A &amp; Chat</text>
  </g>

  <!-- Pill 2: Local RAG -->
  <g class="pill-2" transform="translate(365, 296)">
    <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)" />
    <circle cx="24" cy="21" r="6" fill="#818cf8" />
    <text x="40" y="26" class="pill-label">⚡ Self-Hosted RAG</text>
  </g>

  <!-- Pill 3: Deep Summarization -->
  <g class="pill-3" transform="translate(605, 296)">
    <rect width="225" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)" />
    <circle cx="24" cy="21" r="6" fill="#c084fc" />
    <text x="40" y="26" class="pill-label">🧠 Deep Summarization</text>
  </g>

  <!-- Pill 4: Privacy & IDP -->
  <g class="pill-4" transform="translate(860, 296)">
    <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)" />
    <circle cx="24" cy="21" r="6" fill="#34d399" />
    <text x="40" y="26" class="pill-label">🔒 Zero-Data-Leakage</text>
  </g>
</svg>
